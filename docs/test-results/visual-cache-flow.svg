<svg xmlns="http://www.w3.org/2000/svg" width="960" height="325" viewBox="0 0 960 325" role="img" aria-labelledby="title desc">
<title id="title">Visual cache validation</title>
<desc id="desc">Measured validation result from the development test suite.</desc>
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#172033; }
  .title { font-size:24px; font-weight:700; }
  .sub { font-size:14px; fill:#5b6472; }
  .label { font-size:14px; font-weight:600; }
  .value { font-size:13px; }
  .card { fill:#f7f8fb; stroke:#d8dde7; stroke-width:1; rx:12; }
  .ok { fill:#e9f8ef; stroke:#7bc89b; stroke-width:1; }
  .accent { fill:#4f67d8; }
  .bar2 { fill:#98a5df; }
  .grid { stroke:#e4e7ee; stroke-width:1; }
  .arrow { stroke:#6b7280; stroke-width:2; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#6b7280"/></marker></defs>
<text x="32" y="42" class="title">Visual-reference cache: real STEP A → STEP B</text>
<text x="32" y="67" class="sub">Same SHA-256 reference reused across sessions</text>
<rect x="35" y="105" width="255" height="180" class="card"/>
<text x="55" y="135" class="label">STEP A — NEW</text>
<text x="55" y="164" class="value">sheet.png read/analyzed once</text>
<text x="55" y="189" class="value">image result ≈ 441,718 chars</text>
<text x="55" y="214" class="value">spec + 4 screen crops stored</text>
<text x="55" y="239" class="value">SHA-256 registered</text>
<text x="55" y="264" class="value">FULL ANALYSIS = YES</text>
<path d="M300 195 L438 195" class="arrow"/>
<rect x="450" y="105" width="255" height="180" class="ok"/>
<text x="470" y="135" class="label">STEP B — EXACT HIT</text>
<text x="470" y="164" class="value">4 Bash calls only</text>
<text x="470" y="189" class="value">tool results ≈ 3,128 chars</text>
<text x="470" y="214" class="value">stored spec/crops reused</text>
<text x="470" y="239" class="value">image opened = NO</text>
<text x="470" y="264" class="value">FULL ANALYSIS = NO</text>
<rect x="735" y="105" width="190" height="180" class="card"/>
<text x="755" y="135" class="label">Result</text>
<text x="755" y="164" class="value">Exact hash match</text>
<text x="755" y="189" class="value">No re-upload needed</text>
<text x="755" y="214" class="value">No full spec dump</text>
<text x="755" y="239" class="value">Cross-session reuse</text>
<text x="755" y="264" class="value">PASS</text>
</svg>